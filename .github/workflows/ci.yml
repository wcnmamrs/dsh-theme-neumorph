name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check client.js
          node --check index.js
          node --check scripts/verify-manifest.mjs

      - name: Manifest
        run: node scripts/verify-manifest.mjs

      - name: Tests
        run: npm test

      - name: Package contents
        run: npm pack --dry-run
